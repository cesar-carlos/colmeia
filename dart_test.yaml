# Declares tags referenced by tests (avoids "tag was not specified" warnings).
#
# E2E hits the real Agent SQL bridge; default parallel test workers overload
# the API/SQL queue. Prefer: `flutter test test/integration/e2e --concurrency=1`
# or `flutter test --tags=e2e --concurrency=1`.
# `e2eSetupDependencies` retries transient hub errors on `/client-auth/login`
# and full setup (see e2e_dependency_bootstrap.dart); with
# `AGENT_BRIDGE_TRANSPORT=socket` it also warms `/consumers` when
# `SOCKET_WARM_UP_AFTER_LOGIN` is true (default). Heavy parallel runs may
# still need `--concurrency=1`.
# Optional: `E2E_LOG_TRANSIENT=1` in process env logs mapped hub 503/timeout
# lines from runE2eAppResult (see e2e_dependency_bootstrap.dart).
#
# Baseline (post Fase 0, REST, --concurrency=1): 68 tests, wall-clock ~68–71 s
# on a typical dev machine against the bundled API (hub-dependent). Command:
#   flutter test test/integration/e2e/ --concurrency=1
#
# E2E env A/B (copy knobs into assets/env/local.env; change one variable per run):
# | Run | Transport | Knob changed | Wall-clock | Notes (503, skips) |
# |-----|-----------|--------------|------------|----------------------|
# | 0   | rest      | (baseline)   | ~81 s      | socket smoke skipped |
# | 1   | socket    | (baseline)   | ~89 s      | relay smoke runs      |
# Compare both transports in one go:
#   python tool/compare_e2e_transports.py --scope suite --transport both --timeout-seconds 180
# Optional: E2E_LOG_TRANSIENT=1 to count negotiation/503 mappings.
#
# Socket + relay hits the real hub with longer tail latency than REST-only;
# the default 30s test timeout caused false failures (tearDown disposed relay
# while work was still in flight). Tag timeout keeps VM E2E stable.
# If relay RPCs hang against your hub, set E2E_DISABLE_RELAY_DISPATCH=true
# (see AppEnvironment.e2eDisableRelayDispatch and assets/env/.env.example).
tags:
  e2e:
    description: >
      Repository smoke tests against the real Agent SQL bridge; requires
      E2E_* credentials (see test/integration/e2e/support/).
    timeout: 5m
