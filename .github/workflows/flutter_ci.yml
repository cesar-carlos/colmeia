name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

  test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t root < <(find test -maxdepth 1 -name '*_test.dart' 2>/dev/null | sort || true)
          if [ ${#root[@]} -eq 0 ]; then
            flutter test \
              test/app test/core test/features test/shared test/integration \
              --exclude-tags e2e \
              --reporter expanded
          else
            flutter test \
              "${root[@]}" \
              test/app test/core test/features test/shared test/integration \
              --exclude-tags e2e \
              --reporter expanded
          fi
