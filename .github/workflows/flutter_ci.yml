name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Verify versioned Windows release files are synchronized
        shell: bash
        run: |
          set -euo pipefail
          python installer/update_version.py
          git diff --exit-code -- installer/setup.iss lib/core/constants/app_version.g.dart

      - name: Test Python release tooling
        shell: bash
        run: |
          set -euo pipefail
          python tool/validate_env.py
          python -m unittest discover -s installer/tests -p '*_test.py'
          python -m unittest discover -s tool/tests -p '*_test.py'

      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

  test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t root < <(find test -maxdepth 1 -name '*_test.dart' 2>/dev/null | sort || true)
          if [ ${#root[@]} -eq 0 ]; then
            flutter test \
              test/app test/core test/features test/shared \
              test/docs \
              test/integration/dart_test_config_contract_test.dart \
              --exclude-tags e2e \
              --reporter expanded
          else
            flutter test \
              "${root[@]}" \
              test/app test/core test/features test/shared \
              test/docs \
              test/integration/dart_test_config_contract_test.dart \
              --exclude-tags e2e \
              --reporter expanded
          fi

  android_smoke:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Print JDK and Flutter environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          flutter doctor -v

      - name: Android debug smoke build
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug

  android_release_smoke:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Print JDK and Flutter environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          flutter doctor -v

      - name: Materialize CI-only Android signing files
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -storetype PKCS12 \
            -keystore android/app/ci-upload-keystore.jks \
            -storepass ci-smoke \
            -alias ci \
            -keypass ci-smoke \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=Colmeia CI, OU=CI, O=Colmeia, L=CI, ST=CI, C=BR"
          cat > android/key.properties <<EOF
          storeFile=app/ci-upload-keystore.jks
          storePassword=ci-smoke
          keyAlias=ci
          keyPassword=ci-smoke
          EOF
          chmod 600 android/key.properties android/app/ci-upload-keystore.jks

      - name: Android release smoke build
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify 16 KB native library alignment
        shell: bash
        run: |
          set -euo pipefail
          python tool/check_apk_native_alignment.py \
            build/app/outputs/flutter-apk/app-release.apk

      - name: Clean CI Android signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/ci-upload-keystore.jks

  ios_smoke:
    needs: analyze
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: iOS release compile smoke (no codesign)
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
