name: Tagged Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: tagged-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      full_version: ${{ steps.metadata.outputs.full_version }}
      short_version: ${{ steps.metadata.outputs.short_version }}
      release_title: ${{ steps.metadata.outputs.release_title }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      windows_asset_name: ${{ steps.metadata.outputs.windows_asset_name }}
      android_apk_asset_name: ${{ steps.metadata.outputs.android_apk_asset_name }}
      android_aab_asset_name: ${{ steps.metadata.outputs.android_aab_asset_name }}
      release_url: ${{ steps.metadata.outputs.release_url }}
      windows_asset_url: ${{ steps.metadata.outputs.windows_asset_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag commit is reachable from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "::error::Release tags must point to a commit reachable from origin/main."
            exit 1
          fi

      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python installer/ci_print_release_metadata.py

  build_windows:
    needs: prepare_release
    runs-on: windows-latest
    env:
      # Optional repository variable `APPCAST_FEED_URL` overrides the default feed.
      AUTO_UPDATE_FEED_URL: ${{ vars.APPCAST_FEED_URL != '' && vars.APPCAST_FEED_URL || format('https://raw.githubusercontent.com/{0}/main/appcast.xml', github.repository) }}
      COLMEIA_SKIP_VERSION_SYNC: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Synchronize release files
        shell: bash
        run: |
          set -euo pipefail
          python installer/update_version.py
          git diff --exit-code -- installer/setup.iss lib/core/constants/app_version.g.dart

      - name: Build Windows installer
        shell: pwsh
        run: python installer/build_installer.py

      - name: Prepare Windows release asset
        shell: pwsh
        run: |
          $assetPath = "installer/dist/${{ needs.prepare_release.outputs.windows_asset_name }}"
          if (-not (Test-Path $assetPath)) {
            throw "Expected installer asset was not generated: $assetPath"
          }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $assetPath "release-assets/${{ needs.prepare_release.outputs.windows_asset_name }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/${{ needs.prepare_release.outputs.windows_asset_name }}
          if-no-files-found: error

  build_android:
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing+=(ANDROID_KEYSTORE_BASE64)
          [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -z "$ANDROID_KEY_ALIAS" ] && missing+=(ANDROID_KEY_ALIAS)
          [ -z "$ANDROID_KEY_PASSWORD" ] && missing+=(ANDROID_KEY_PASSWORD)
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Materialize Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=app/upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Build signed Android APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Build signed Android App Bundle
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release

      - name: Prepare Android release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk \
            "release-assets/${{ needs.prepare_release.outputs.android_apk_asset_name }}"
          cp build/app/outputs/bundle/release/app-release.aab \
            "release-assets/${{ needs.prepare_release.outputs.android_aab_asset_name }}"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            release-assets/${{ needs.prepare_release.outputs.android_apk_asset_name }}
            release-assets/${{ needs.prepare_release.outputs.android_aab_asset_name }}
          if-no-files-found: error

      - name: Clean Android signing files
        if: always()
        shell: bash
        run: rm -f android/key.properties android/app/upload-keystore.jks

  publish_release:
    needs:
      - prepare_release
      - build_windows
      - build_android
    runs-on: ubuntu-latest
    environment:
      name: production
    outputs:
      published_at_http: ${{ steps.release_metadata.outputs.published_at_http }}
      release_url: ${{ steps.release_metadata.outputs.release_url }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Generate release checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No release assets were found to publish."
            exit 1
          fi

          pushd release-assets >/dev/null
          for asset in *; do
            if [ -f "$asset" ] && [[ "$asset" != *.sha256 ]]; then
              sha256sum "$asset" > "$asset.sha256"
            fi
          done
          popd >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare_release.outputs.release_tag }}'
          title='${{ needs.prepare_release.outputs.release_title }}'

          gh --version
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title"
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* \
              --title "$title" \
              --generate-notes \
              --latest
          fi

      - name: Resolve published release metadata
        id: release_metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ needs.prepare_release.outputs.release_tag }}'
          gh release view "$tag" --json publishedAt,url > release-metadata.json
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata = json.loads(Path("release-metadata.json").read_text(encoding="utf-8"))
          published_at = metadata.get("publishedAt")
          if not published_at:
              raise SystemExit("GitHub release did not return publishedAt.")

          published_at_http = (
              datetime.fromisoformat(published_at.replace("Z", "+00:00"))
              .astimezone(timezone.utc)
              .strftime("%a, %d %b %Y %H:%M:%S GMT")
          )

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"published_at_http={published_at_http}\n")
              output.write(f"release_url={metadata['url']}\n")
          PY

  update_windows_appcast:
    needs:
      - prepare_release
      - build_windows
      - publish_release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Windows release asset
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-assets

      - name: Generate appcast.xml
        shell: bash
        run: |
          set -euo pipefail
          asset_path="release-assets/${{ needs.prepare_release.outputs.windows_asset_name }}"
          asset_length=$(stat -c%s "$asset_path")

          python tool/update_appcast.py \
            --output appcast.xml \
            --version '${{ needs.prepare_release.outputs.full_version }}' \
            --short-version '${{ needs.prepare_release.outputs.short_version }}' \
            --asset-url '${{ needs.prepare_release.outputs.windows_asset_url }}' \
            --release-notes-url '${{ needs.publish_release.outputs.release_url }}' \
            --published-at '${{ needs.publish_release.outputs.published_at_http }}' \
            --content-length "$asset_length" \
            --title 'Colmeia' \
            --description 'Most recent Windows releases for Colmeia' \
            --language 'pt-BR' \
            --max-items 5

      - name: Publish appcast.xml to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPCAST_PUSH_TOKEN: ${{ secrets.APPCAST_PUSH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = (os.environ.get("APPCAST_PUSH_TOKEN") or "").strip() or (
              os.environ.get("GITHUB_TOKEN") or ""
          ).strip()
          if not token:
              raise SystemExit("No token available to publish appcast.xml.")

          repo = os.environ["GITHUB_REPOSITORY"]
          url = f"https://api.github.com/repos/{repo}/contents/appcast.xml"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "colmeia-tagged-release",
          }

          local_content = Path("appcast.xml").read_text(encoding="utf-8")
          remote_document = None

          request = urllib.request.Request(f"{url}?ref=main", headers=headers)
          try:
              with urllib.request.urlopen(request) as response:
                  remote_document = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise

          if remote_document is not None:
              remote_content = base64.b64decode(remote_document["content"]).decode("utf-8")
              if remote_content == local_content:
                  print("appcast.xml already up to date.")
                  sys.exit(0)

          request_body = {
              "message": (
                  "chore: update appcast for "
                  "${{ needs.prepare_release.outputs.short_version }}"
              ),
              "content": base64.b64encode(local_content.encode("utf-8")).decode("ascii"),
              "branch": "main",
          }
          if remote_document is not None:
              request_body["sha"] = remote_document["sha"]

          update_request = urllib.request.Request(
              url,
              data=json.dumps(request_body).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(update_request):
              pass
          PY
