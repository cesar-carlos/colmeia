name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      AUTO_UPDATE_FEED_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/appcast.xml
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: ./.github/actions/setup-colmeia-flutter
        with:
          flutter-version: ${{ vars.FLUTTER_CI_VERSION }}

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml -Raw
          $match = [regex]::Match(
            $content,
            '^version:\s*["'']?(\d+\.\d+\.\d+(?:\+\d+)?)',
            [System.Text.RegularExpressions.RegexOptions]::Multiline
          )
          if (-not $match.Success) {
            throw 'version was not found in pubspec.yaml'
          }

          $fullVersion = $match.Groups[1].Value
          $shortVersion = $fullVersion.Split('+')[0]
          $expectedTag = "v$shortVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match pubspec.yaml version $shortVersion"
          }

          "full_version=$fullVersion" >> $env:GITHUB_OUTPUT
          "short_version=$shortVersion" >> $env:GITHUB_OUTPUT
          "asset_name=Colmeia-Setup-$shortVersion.exe" >> $env:GITHUB_OUTPUT
          "asset_path=installer/dist/Colmeia-Setup-$shortVersion.exe" >> $env:GITHUB_OUTPUT
          "release_url=https://github.com/${{ github.repository }}/releases/tag/$env:GITHUB_REF_NAME" >> $env:GITHUB_OUTPUT
          "asset_url=https://github.com/${{ github.repository }}/releases/download/$env:GITHUB_REF_NAME/Colmeia-Setup-$shortVersion.exe" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Synchronize release files
        shell: bash
        run: |
          set -euo pipefail
          python installer/update_version.py
          git diff --exit-code -- installer/setup.iss lib/core/constants/app_version.g.dart

      - name: Build Windows installer
        shell: pwsh
        run: python installer/build_installer.py

      - name: Verify installer asset
        shell: pwsh
        run: |
          if (-not (Test-Path '${{ steps.metadata.outputs.asset_path }}')) {
            throw 'Expected installer asset was not generated.'
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $title = 'Version ${{ steps.metadata.outputs.short_version }}'
          $asset = '${{ steps.metadata.outputs.asset_path }}'

          gh --version
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title $title --generate-notes --latest
          }

      - name: Update appcast.xml
        shell: pwsh
        run: |
          $publishedAt = (Get-Date).ToUniversalTime().ToString('r')
          $assetLength = (Get-Item '${{ steps.metadata.outputs.asset_path }}').Length

          python tool/update_appcast.py `
            --output appcast.xml `
            --version '${{ steps.metadata.outputs.full_version }}' `
            --short-version '${{ steps.metadata.outputs.short_version }}' `
            --asset-url '${{ steps.metadata.outputs.asset_url }}' `
            --release-notes-url '${{ steps.metadata.outputs.release_url }}' `
            --published-at "$publishedAt" `
            --content-length $assetLength `
            --title 'Colmeia' `
            --description 'Most recent Windows releases for Colmeia' `
            --language 'pt-BR' `
            --max-items 5

      - name: Commit appcast.xml to main via Contents API
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPCAST_PUSH_TOKEN: ${{ secrets.APPCAST_PUSH_TOKEN }}
        run: |
          $token = if ([string]::IsNullOrWhiteSpace($env:APPCAST_PUSH_TOKEN)) {
            $env:GITHUB_TOKEN
          } else {
            $env:APPCAST_PUSH_TOKEN
          }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw 'No token available to publish appcast.xml.'
          }

          $headers = @{
            Authorization = "Bearer $token"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'colmeia-windows-release'
          }

          $repoContentsUrl = 'https://api.github.com/repos/${{ github.repository }}/contents/appcast.xml'
          $localContent = [System.IO.File]::ReadAllText((Join-Path $PWD 'appcast.xml'))
          $remoteDocument = $null

          try {
            $remoteDocument = Invoke-RestMethod `
              -Uri "$repoContentsUrl?ref=main" `
              -Headers $headers `
              -Method Get
          } catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            if ($statusCode -ne 404) {
              throw
            }
          }

          if ($remoteDocument -ne $null) {
            $remoteContentBytes = [Convert]::FromBase64String(
              ($remoteDocument.content -replace '\s', '')
            )
            $remoteContent = [System.Text.Encoding]::UTF8.GetString($remoteContentBytes)
            if ($remoteContent -eq $localContent) {
              Write-Host 'appcast.xml already up to date.'
              exit 0
            }
          }

          $requestBody = @{
            message = 'chore: update appcast for ${{ steps.metadata.outputs.short_version }}'
            content = [Convert]::ToBase64String(
              [System.Text.Encoding]::UTF8.GetBytes($localContent)
            )
            branch = 'main'
          }

          if ($remoteDocument -ne $null) {
            $requestBody.sha = $remoteDocument.sha
          }

          $requestJson = $requestBody | ConvertTo-Json
          Invoke-RestMethod `
            -Uri $repoContentsUrl `
            -Headers $headers `
            -Method Put `
            -ContentType 'application/json' `
            -Body $requestJson | Out-Null
