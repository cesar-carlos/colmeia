org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin incremental compilation fails on Windows when pub cache (C:) and project (e.g. D:) are on different drives.
kotlin.incremental=false
# Keep the legacy Kotlin plugin until all Flutter plugins support built-in Kotlin.
android.builtInKotlin=false
# Flutter's current Gradle adapter still uses the legacy Android extension.
android.newDsl=false
