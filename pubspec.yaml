name: colmeia
description: "Dashboards e relatórios operacionais para gestão multi-loja."
publish_to: "none"

version: 1.1.5+6

environment:
  sdk: ^3.11.0

dependencies:
  auto_updater: ^1.0.0
  brasil_fields: ^1.18.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.9.2

  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.0
  flutter_form_builder: ^10.3.0+2

  flutter_localizations:
    sdk: flutter

  flutter_secure_storage: ^10.0.0

  flutter_web_plugins:
    sdk: flutter

  form_builder_validators: ^11.3.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  hive_ce: ^2.19.3
  image_picker: ^1.2.1
  intl: ^0.20.2
  logger: ^2.7.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  printing: ^5.14.3
  provider: ^6.1.5+1
  result_dart: ^2.2.0
  sentry_flutter: ^9.19.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  socket_io_client: ^3.1.4
  syncfusion_flutter_charts: ^33.2.4
  syncfusion_flutter_datagrid: ^33.2.4
  syncfusion_flutter_datepicker: ^33.2.4
  syncfusion_flutter_gauges: ^33.2.4
  syncfusion_flutter_maps: ^33.2.4
  syncfusion_flutter_treemap: ^33.2.4
  syncfusion_flutter_xlsio: ^33.2.4
  uuid: ^4.5.3
  zard: ^1.0.0

dependency_overrides:
  objective_c:
    git:
      url: https://github.com/dart-lang/native.git
      path: pkgs/objective_c
      ref: 998ed88f0014f6e75ef3adec5bc6c21a80bf598b

dev_dependencies:
  build_runner: ^2.15.0
  checks: ^0.3.1
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter

  image: ^4.8.0
  mocktail: ^1.0.5
  test_api: ^0.7.9
  very_good_analysis: ^10.2.0

flutter_launcher_icons:
  image_path: assets/icons/colmeia-512.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFF8F0"
  min_sdk_android: 21
  adaptive_icon_background: "#FFB300"
  adaptive_icon_foreground: assets/icons/colmeia-512.png
  web:
    generate: true
    image_path: assets/icons/colmeia-512.png
    background_color: "#FFB300"
    theme_color: "#FFB300"
  # Windows .ico is produced by tool/generate_windows_app_icon.dart (multi-res)
  # before each installer build — see installer/build_installer.py.
  windows:
    generate: false

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Runtime env config (see EnvAssetPaths in core/config/env_keys.dart)
    - assets/env/default.env
    - assets/env/local.env

    # App images — add files to assets/images/ and register the directory once:
    # - assets/images/

    # Lottie/Rive animations — add files to assets/animations/:
    # - assets/animations/

    # Note: assets/icons/ is build-time only (flutter_launcher_icons) and
    # should NOT be listed here.

  # Custom fonts — the project uses google_fonts at runtime, so no bundled
  # font files are needed today. When offline-first fonts become necessary,
  # download them to assets/fonts/ and declare them here:
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
